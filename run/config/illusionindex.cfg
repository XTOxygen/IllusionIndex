# Configuration file

##########################################################################################################
# afterimage
#--------------------------------------------------------------------------------------------------------#
# How many seconds afterimages remain visible before fading out.
##########################################################################################################

afterimage {
    # Draw fading afterimage trails behind invisible players.
    B:afterimages=true

    # Maximum number of afterimage frames per player.
    I:count=12

    # How many seconds afterimages remain visible before fading out.
    S:lingerSeconds=1.0
}


##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Maximum distance at which silhouettes/afterimages are drawn.
##########################################################################################################

general {
    # Announce invisible players that are within attack range in chat.
    B:chatAlerts=true

    # Master switch of IllusionIndex.
    B:enabled=true

    # Maximum distance at which silhouettes/afterimages are drawn.
    S:maxRenderDistance=96.0

    # Key that opens the IllusionIndex settings GUI.
    I:openGuiKey=23

    # Attack range (in blocks) used for the chat spot alert.
    S:spotRange=3.0
}


##########################################################################################################
# render
#--------------------------------------------------------------------------------------------------------#
# Opacity of the silhouette / afterimage (0.05 - 1.0).
##########################################################################################################

render {
    # Base colour (RGB) used for the silhouettes, e.g. 0x000000 = pure black.
    I:baseColor=0

    # Render invisible players as semi-transparent silhouettes in the configured base colour.
    B:observeInvisible=true

    # Opacity of the silhouette / afterimage (0.05 - 1.0).
    S:opacity=0.800000011920929
}


